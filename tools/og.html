<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&display=block">
<style>
/* OGP 画像（1200×630）の元。tools/make-og.mjs が撮って og.png にする */
body{margin:0;width:1200px;height:630px;background:#f3f5f8;font-family:"M PLUS Rounded 1c",sans-serif;color:#1d2433;display:flex;align-items:center;gap:48px;padding:0 64px;box-sizing:border-box;overflow:hidden}
.l{flex:1}
h1{font-family:"Dela Gothic One";font-size:96px;margin:0;line-height:1;white-space:nowrap}
h1 b{color:#e8305f}
p{font-size:40px;font-weight:800;margin:28px 0 0;line-height:1.4}
small{display:block;font-size:26px;color:#6b7385;margin-top:18px;font-weight:700}
.ad{position:relative;width:420px;background:#fff6a8;color:#2a1a00;border:5px solid #2a1a00;border-radius:10px;box-shadow:12px 12px 0 #2a1a00;padding:52px 26px 30px;text-align:center;font-weight:800;transform:rotate(2deg)}
.ad .tag{position:absolute;left:10px;top:6px;font-size:18px;opacity:.65}
.ad .x{position:absolute;top:4px;font-size:34px}
.ad h3{font-family:"Dela Gothic One";color:#e8305f;font-size:44px;line-height:1.25;margin:0 0 14px}
.ad .b{display:inline-block;background:#e8305f;color:#fff;border-radius:999px;padding:16px 36px;font-size:28px}
.q{position:absolute;right:-30px;bottom:-40px;background:#1d2433;color:#fff;border-radius:999px;padding:12px 24px;font-size:26px;transform:rotate(-4deg)}
</style></head><body>
<div class="l"><h1><b>×</b>はどこだ</h1><p>広告をよけて<br>記事を最後まで読め</p><small>まちがえて押すと、ウイルスに感染…</small></div>
<div class="ad"><span class="tag">広告</span><span class="x" style="right:96px">✕</span><span class="x" style="right:56px">Χ</span><span class="x" style="right:16px">×</span>
<h3>今だけ使える<br>500円クーポン</h3><span class="b">受け取る</span><span class="q">本物の×はどれ？</span></div>
</body></html>
