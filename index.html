/* Layout: 本物のサイトのような記事ページ。読み進めると広告がふさぐ。単一テーマ（昼のサイト）で固定 */
:root{

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;margin:0}
button{font-family:var(--body)}

<body>
<div id="page">
  <div class="top"><div class="logo"><b>×</b>はどこだ</div><div class="topr"><span class="cnt" id="cnt" aria-live="polite"></span><button class="icon" id="soundBtn" type="button" aria-label="音を切る">🔊</button><div class="clock" id="clock">0.0秒</div></div><div class="prog" aria-hidden="true"><i id="progBar"></i></div></div>
  <div id="appbarSlot"></div>
  <div class="article" id="art"></div>
</div>
<div id="stage"></div>
<div class="anchor" id="anchor" hidden><button class="fold" id="fold" type="button" aria-label="広告を閉じる">×</button><div class="pic" aria-hidden="true">P</div><span id="anchorTxt"></span></div>
<div class="panel" id="panel" hidden><button id="hintBtn" type="button">ヒント（+5秒）</button></div>
<div class="say" id="say" style="opacity:0"></div>
<div id="virus" hidden><div class="noise"></div>
  <div class="scare"><div class="warn">⚠ SYSTEM ALERT ⚠</div><h2>ウイルスに感染しました</h2>
    <p id="vmsg">あなたの端末から 写真 を送信しています…</p><div class="bar"><i id="vbar"></i></div><div class="log" id="vlog"></div></div>
  <div class="over"><b>GAME OVER</b><p id="vwhy"></p><div class="how2" id="vhow"></div><p style="font-size:12px;opacity:.7">※ゲームの画面です。実際の端末には何も起きていません。</p>
    <div class="btns"><button class="big" id="againBtn" type="button">もう一度</button><button class="big btn2" id="menuBtn" type="button">メニュー</button></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const stage=$('#stage'), page=$('#page'), say=$('#say');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// 乱数。「今日の1本」と挑戦状は日付の番号から作る乱数で、だれが遊んでも同じ広告の並びになる
let R=Math.random;
function seeded(n){let a=(n*2654435761)>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const rnd=a=>a[Math.floor(R()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild}
let toastT;function toast(t,ms=900){say.textContent=t;say.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>say.style.opacity=0,ms)}

/* ---------- 音（ボタンを押したあとだけ鳴る。外へは何も送らない） ---------- */
let ac=null, soundOn=store.get('xdoko-sound')!=='off';
function tone(f,d,type='sine',v=.12,slide=0){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.linearRampToValueAtTime(f+slide,ac.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const SND={close:()=>tone(880,.08,'triangle'),clear:()=>{tone(660,.12);setTimeout(()=>tone(990,.2),120)},
  // 感染したときは、音ありなら端末も短くふるわせる（Android など、使える端末だけ）
  virus:()=>{tone(120,.8,'sawtooth',.15,-60);setTimeout(()=>tone(90,.8,'square',.08),200);if(soundOn)try{navigator.vibrate&&navigator.vibrate([120,60,180])}catch(e){}},video:()=>tone(330,.3,'square',.05)};
function setSound(){$('#soundBtn').textContent=soundOn?'🔊':'🔇';$('#soundBtn').setAttribute('aria-label',soundOn?'音を切る':'音を出す')}
$('#soundBtn').onclick=()=>{soundOn=!soundOn;store.set('xdoko-sound',soundOn?'on':'off');setSound()};setSound();

  const d=dex(), st=stats(), ks=Object.keys(TYPES), got=ks.filter(k=>d[k]).length, s=streak();
  const medals=ARTICLES.reduce((m,a)=>{[[best(a.id),false],[bestH(a.id),true]].forEach(([t,h])=>{const x=medal(t,a,h);if(x)m[x]=(m[x]||0)+1});return m},{});
  const box=el(`<div class="card"><h3>広告図鑑 ${got}/${ks.length}</h3><p>${got===ks.length?'全部の広告を見つけた！':'閉じた広告がここに残ります。'}${got?'<br>「練習」で、時間を気にせず何度でも試せます。':''}</p>
   <div class="dex">${ks.map(k=>{const T=TYPES[k],e=d[k],star='★'.repeat(T.lv);return e?`<div><b>${T.name} <small>${star}</small></b>${T.hint}<br><small>閉じた ${e.n}回${e.clean?'・ヒントなしで閉じた':''}</small><button class="pr" type="button" data-pr="${k}">練習</button></div>`:`<div class="no"><b>？？？ <small>${star}</small></b>まだ出会っていない</div>`}).join('')}</div>
   <p class="sec">実績 ${achGot().length}/${ACH.length}</p>
   <div class="dex ach">${(g=>ACH.map(x=>g.includes(x[0])?`<div><b>🏅 ${x[1]}</b>${x[2]}</div>`:`<div class="no"><b>？ ${x[1]}</b>${x[2]}</div>`).join(''))(achGot())}</div>
   <p class="sec">記録</p>
   <div class="stats"><span>読み切った<b>${st.clear||0}回</b></span><span>閉じた広告<b>${st.closed||0}枚</b></span><span>感染した<b>${st.virus||0}回</b></span><span>連続の最高<b>${s.max||0}日</b></span><span style="grid-column:1/-1">メダル<b>🥇${medals['🥇']||0}　🥈${medals['🥈']||0}　🥉${medals['🥉']||0}</b></span></div>
   <button class="big" id="dexBack" type="button">メニューへ</button></div>`);
  stage.appendChild(box);box.querySelector('#dexBack').onclick=menu;box.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>practice(b.dataset.pr));page.classList.add('lock');
}
// 練習：図鑑で見つけた広告を1枚だけ試す。時間も記録（ベスト・図鑑・記録）も残さない。まちがえても感染の画面は出さず、閉じ方を見せる
function practice(type){
  if(!TYPES[type])return showDex();
  stop();MODE={kind:'practice',type};A=null;ORDER=[type];n=0;used=[];SPL=[];V=-1;pen=0;$('#virus').hidden=true;$('#clock').textContent=fmt(0);
  openAd(true);
  const tag=document.createElement('p');tag.className='practice';tag.textContent=`練習：${TYPES[type].name}（時間も記録も残らない）`;stage.appendChild(tag);
}
function practiceEnd(ok,why){
  const type=MODE.type,T=TYPES[type];if(ok)SND.close();stop();$('#panel').hidden=true;
  stage.className='menu';stage.hidden=false;stage.innerHTML='';
  const box=el(`<div class="card"><h3>${ok?'閉じられた！':'それは広告の一部でした'}</h3><p><b>${T.name}</b> <small>${'★'.repeat(T.lv)}</small></p>${ok?'':'<p class="lost" id="prWhy"></p>'}<p>閉じ方：${T.hint}</p><p class="total">練習なので、時間も記録も残りません</p>
   <div class="btns"><button class="big" id="prAgain" type="button">もう一度</button><button class="big btn2" id="prBack" type="button">図鑑へ</button></div></div>`);
  if(!ok)box.querySelector('#prWhy').textContent=why||'';
  stage.appendChild(box);box.querySelector('#prAgain').onclick=()=>practice(type);box.querySelector('#prBack').onclick=showDex;page.classList.add('lock');
}
// 挑戦状のリンク（?d=日の番号&t=秒 か ?a=記事&t=秒）で開いたら、その場で挑戦できるようにする
function fromLink(){
  let q;try{q=new URLSearchParams(location.search)}catch(e){return false}
  const t=Number(q.get('t')), rival=t>0&&t<10000?Math.round(t*10)/10:0;
  const d=Number(q.get('d')), a=byId(q.get('a')), seed=Number(q.get('s'));
  try{if(q.has('d')||q.has('a'))history.replaceState(null,'',location.pathname)}catch(e){}
  if(Number.isInteger(d)&&d>=1&&d<=today()){start(dailyArt(d),dailyMode(d,rival));return true}
  if(a){start(a,{kind:'article',rival,seed:okSeed(seed)?seed:0,hard:q.get('h')==='1'&&!a.long});return true}
  return false;
}
$('#hintBtn').onclick=()=>{const h=$('#hintTxt');if(h&&h.hidden){h.hidden=false;hints++;pen+=5;used[n]=true;toast('+5秒')}};
$('#againBtn').onclick=()=>start(A,again());
$('#menuBtn').onclick=menu;
if(!fromLink())menu();
</script>
